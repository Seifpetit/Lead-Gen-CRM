services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: leadgen
      POSTGRES_PASSWORD: leadgen
      POSTGRES_DB: leadgen
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leadgen']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
